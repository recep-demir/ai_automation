name: Security Agent CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-logic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio
          # Eğer bir requirements.txt dosyan varsa:
          # pip install -r SecurityAgent-API/requirements.txt

      - name: Run Tests with Pytest
        run: |
          python -m pytest SecurityAgent-API/tests/