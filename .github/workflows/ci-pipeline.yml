name: Security Agent CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-logic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio
          # Artık requirements.txt doğrudan kök dizinde:
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests with Pytest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} 
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -m pytest tests/ -s

      - name: Log in to Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Build and Push Docker Image
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build -t "$DOCKER_USER/security-agent-api:latest" .
          docker push "$DOCKER_USER/security-agent-api:latest"